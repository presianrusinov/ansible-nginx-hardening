---
- name: Ensure systemd drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/ai-backend.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy hardening override for ai-backend
  ansible.builtin.copy:
    dest: /etc/systemd/system/ai-backend.service.d/override.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible

      [Unit]
      StartLimitIntervalSec=60
      StartLimitBurst=5

      [Service]
      # Reliability
      Restart=on-failure
      RestartSec=2s
      TimeoutStartSec=30s
      TimeoutStopSec=20s
      KillMode=mixed
      KillSignal=SIGTERM
      SendSIGKILL=yes

      # Hardening
      NoNewPrivileges=yes
      PrivateTmp=yes
      PrivateDevices=yes
      ProtectSystem=full
      ProtectHome=yes
      ProtectControlGroups=yes
      ProtectKernelTunables=yes
      ProtectKernelModules=yes
      ProtectKernelLogs=yes
      ProtectClock=yes
      LockPersonality=yes
      RestrictSUIDSGID=yes
      RemoveIPC=yes
      UMask=0077

      CapabilityBoundingSet=
      AmbientCapabilities=

      RestrictNamespaces=yes
      RestrictRealtime=yes

      # Keep networking working for API calls/DB etc.
      RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
  notify:
    - systemd daemon-reload
    - restart ai-backend

- name: Ensure ai-backend is enabled
  ansible.builtin.systemd:
    name: ai-backend
    enabled: true

