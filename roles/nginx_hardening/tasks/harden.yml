---
# Hardening tasks for Nginx

- name: Disable server_tokens
  ansible.builtin.lineinfile:
    path: /etc/nginx/nginx.conf
    regexp: '^\s*server_tokens'
    line: '    server_tokens off;'
    insertafter: 'http {'
  notify: restart nginx
  become: true

- name: Set correct ownership for Nginx directories
  ansible.builtin.file:
    path: /usr/share/nginx
    owner: root
    group: root
    recurse: true
  become: true

- name: Secure nginx.conf permissions
  ansible.builtin.file:
    path: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Secure website root directory
  ansible.builtin.file:
    path: /usr/share/nginx/html
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Create SSL directory
  ansible.builtin.file:
    path: /etc/nginx/ssl
    state: directory
    owner: root
    group: root
    mode: "0700"
  become: true

- name: Generate self-signed SSL certificate
  ansible.builtin.command: >
    openssl req -x509 -nodes -days 365
    -newkey rsa:2048
    -keyout /etc/nginx/ssl/selfsigned.key
    -out /etc/nginx/ssl/selfsigned.crt
    -subj "/C=BG/ST=Plovdiv/L=Plovdiv/O=AI-DevOps/OU=Training/CN=localhost"
  args:
    creates: /etc/nginx/ssl/selfsigned.crt
  notify: restart nginx
  become: true

# Optional default site management (disabled by default via defaults/main.yml)
- name: Ensure default site configuration file exists
  ansible.builtin.copy:
    dest: /etc/nginx/conf.d/default.conf
    content: |
      server {
          listen 80 default_server;
          listen [::]:80 default_server;

          root /usr/share/nginx/html;
          index index.html;

          server_name _;

          location / {
              try_files $uri $uri/ =404;
          }
      }
  when: nginx_manage_default_site | bool
  notify: restart nginx
  become: true

- name: Configure SSL in default site
  ansible.builtin.blockinfile:
    path: /etc/nginx/conf.d/default.conf
    insertafter: EOF
    block: |
      server {
          listen 443 ssl default_server;
          listen [::]:443 ssl default_server;
          ssl_certificate /etc/nginx/ssl/selfsigned.crt;
          ssl_certificate_key /etc/nginx/ssl/selfsigned.key;

          root /usr/share/nginx/html;
          index index.html;
          server_name _;

          location / {
              try_files $uri $uri/ =404;
          }
      }
  when: nginx_manage_default_site | bool
  notify: restart nginx
  become: true

- name: Fix SELinux context for Nginx web root
  ansible.builtin.command: chcon -R -t httpd_sys_content_t /usr/share/nginx/html
  changed_when: false
  become: true

# Optional: do NOT overwrite frontend by default
- name: Deploy simple HTML test page
  ansible.builtin.copy:
    dest: /usr/share/nginx/html/index.html
    content: |
      <html>
      <head>
        <meta charset="UTF-8">
        <title>AI + DevOps Project</title>
        <style>
          body { text-align:center; margin-top:15%; font-family: Arial, sans-serif; }
          h1 { font-size: 28px; color: #222; }
          p { color: #555; }
        </style>
      </head>
      <body>
        <h1>Nginx is running</h1>
        <p>This page is optionally deployed via Ansible.</p>
      </body>
      </html>
    owner: root
    group: root
    mode: "0644"
  when: nginx_deploy_test_page | bool
  become: true

# Replace root path only in files that exist (no default.conf hardcoding)
- name: Find Nginx conf.d files
  ansible.builtin.find:
    paths: /etc/nginx/conf.d
    patterns: "*.conf"
    file_type: file
  register: nginx_confd_files
  become: true

- name: Ensure correct root path in Nginx conf.d files
  ansible.builtin.replace:
    path: "{{ item.path }}"
    regexp: "/var/www/html"
    replace: "/usr/share/nginx/html"
  loop: "{{ nginx_confd_files.files }}"
  when: nginx_confd_files.matched | int > 0
  notify: restart nginx
  become: true

