---
- name: Create backend directory
  file:
    path: /var/www/ai_project
    state: directory
    owner: "{{ web_owner_user }}"
    group: "{{ web_owner_group }}"
    mode: '0755'

- name: Copy backend files
  copy:
    src: "{{ item }}"
    dest: /var/www/ai_project/{{ item }}
    mode: '0644'
  loop:
    - app.py
    - database.py
    - schema.sql
    - requirements.txt

- name: Install pip for Python 3
  shell: |
    curl -sS https://bootstrap.pypa.io/get-pip.py -o /tmp/get-pip.py
    python3 /tmp/get-pip.py
  args:
    creates: /usr/local/bin/pip3

- name: Install Python dependencies
  pip:
    requirements: /var/www/ai_project/requirements.txt

# ---------------------------
# FIX: Proper NLTK install
# ---------------------------

- name: Ensure NLTK directory exists in correct system path
  file:
    path: /usr/local/share/nltk_data/sentiment
    state: directory
    mode: '0755'

- name: Download VADER lexicon manually
  get_url:
    url: https://raw.githubusercontent.com/cjhutto/vaderSentiment/master/vaderSentiment/vader_lexicon.txt
    dest: /usr/local/share/nltk_data/sentiment/vader_lexicon.txt
    mode: '0644'

# ---------------------------
# Systemd service fix
# ---------------------------

- name: Install ai-backend systemd service (templated user)
  ansible.builtin.template:
    src: ai-backend.service.j2
    dest: /etc/systemd/system/ai-backend.service
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload systemd

- name: Enable and restart backend service
  ansible.builtin.systemd:
    name: ai-backend.service
    enabled: true
    state: restarted
  become: true

