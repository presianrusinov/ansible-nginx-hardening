---
- name: Create backend directory
  file:
    path: /var/www/ai_project
    state: directory
    owner: ec2-user
    group: ec2-user
    mode: '0755'

- name: Copy backend files
  copy:
    src: "{{ item }}"
    dest: /var/www/ai_project/{{ item }}
    owner: ec2-user
    group: ec2-user
    mode: '0644'
  loop:
    - app.py
    - database.py
    - schema.sql
    - requirements.txt

- name: Install pip for Python 3 on Amazon Linux 2023
  shell: |
    curl -sS https://bootstrap.pypa.io/get-pip.py -o /tmp/get-pip.py
    python3 /tmp/get-pip.py
  args:
    creates: /usr/local/bin/pip3

- name: Install Python dependencies
  pip:
    requirements: /var/www/ai_project/requirements.txt
    executable: pip3

- name: Deploy systemd service
  copy:
    src: ai-backend.service
    dest: /etc/systemd/system/ai-backend.service
    owner: root
    group: root
    mode: '0644'

- name: Reload systemd
  systemd:
    daemon_reload: yes

- name: Enable and start service
  systemd:
    name: ai-backend.service
    enabled: yes
    state: restarted

