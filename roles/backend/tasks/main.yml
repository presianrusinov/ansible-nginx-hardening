---
- name: Create backend directory
  ansible.builtin.file:
    path: /var/www/ai_project
    state: directory
    owner: "{{ web_owner_user }}"
    group: "{{ web_owner_group }}"
    mode: "0755"
  become: true

- name: Copy backend files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/var/www/ai_project/{{ item }}"
    owner: "{{ web_owner_user }}"
    group: "{{ web_owner_group }}"
    mode: "0644"
  loop:
    - app.py
    - database.py
    - schema.sql
    - requirements.txt
  become: true

- name: Ensure Python and pip tooling are installed (Rocky/RHEL)
  ansible.builtin.dnf:
    name:
      - python3
      - python3-pip
      - python3-setuptools
    state: present
    update_cache: true
  become: true

- name: Install Python dependencies (pip)
  ansible.builtin.pip:
    requirements: /var/www/ai_project/requirements.txt
    executable: /usr/bin/pip3
  become: true

# Ensure gunicorn exists where systemd unit expects it
- name: Ensure gunicorn is installed via pip
  ansible.builtin.command: /usr/bin/pip3 install --upgrade gunicorn
  register: gunicorn_install
  changed_when: "'Successfully installed' in gunicorn_install.stdout or 'Installing collected packages' in gunicorn_install.stdout"
  become: true

- name: Verify gunicorn binary exists
  ansible.builtin.stat:
    path: /usr/local/bin/gunicorn
  register: gunicorn_bin
  become: true

- name: Fail if /usr/local/bin/gunicorn is missing
  ansible.builtin.fail:
    msg: "Expected /usr/local/bin/gunicorn to exist, but it does not. pip install may have failed."
  when: not gunicorn_bin.stat.exists

# ---------------------------
# NLTK data (VADER lexicon)
# ---------------------------

- name: Ensure NLTK directory exists in correct system path
  ansible.builtin.file:
    path: /usr/local/share/nltk_data/sentiment
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Download VADER lexicon manually
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/cjhutto/vaderSentiment/master/vaderSentiment/vader_lexicon.txt
    dest: /usr/local/share/nltk_data/sentiment/vader_lexicon.txt
    owner: root
    group: root
    mode: "0644"
  become: true

# ---------------------------
# Systemd service
# ---------------------------

- name: Remove old gunicorn path drop-in if present (avoid confusion)
  ansible.builtin.file:
    path: /etc/systemd/system/ai-backend.service.d/10-gunicorn-path.conf
    state: absent
  become: true
  notify: Reload systemd

- name: Install ai-backend systemd service
  ansible.builtin.template:
    src: ai-backend.service.j2
    dest: /etc/systemd/system/ai-backend.service
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload systemd

- name: Enable and restart backend service
  ansible.builtin.systemd:
    name: ai-backend.service
    enabled: true
    state: restarted
  become: true

